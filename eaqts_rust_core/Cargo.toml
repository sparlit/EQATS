[package]
name = "eaqts_rust_core"
version = "6.0.0"
edition = "2021"

[lib]
name = "eaqts_rust_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "blockchain_db"
path = "src/bin/blockchain_db.rs"

[dependencies]
rayon = "1.8"
pyo3 = { version = "0.20", features = ["extension-module"], optional = true }

[features]
default = []
python = ["dep:pyo3"]
