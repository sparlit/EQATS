llm:
  provider: OPENAI

  meta:
    model: gpt-4o-mini
    max_tokens: 1200
    temperature: 0.3

  http_client:
    timeout: 120
    api_url: https://api.openai.com/v1
    api_token: ${OPENAI_API_KEY}

vcs:
  provider: GITHUB

  pipeline:
    owner: ${GITHUB_REPOSITORY_OWNER}
    repo: ${GITHUB_REPOSITORY_NAME}
    pull_number: ${PR_NUMBER}

  http_client:
    timeout: 120
    api_url: https://api.github.com
    api_token: ${GITHUB_TOKEN}
