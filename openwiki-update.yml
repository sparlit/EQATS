name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    # GitHub schedules use UTC; 08:00 UTC is midnight PST.
    - cron: "0 8 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Disable credential persistence to prevent installed packages from
          # accessing the GitHub token via .git/config
          persist-credentials: false
          # Full history so `openwiki code --update` can diff HEAD against the
          # commit it last documented; a shallow clone hides that commit and the
          # update runs against an empty change summary.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install OpenWiki with locked dependencies
        # Use a committed package.json and package-lock.json for reproducible builds.
        # This ensures all transitive dependencies are pinned and integrity-checked.
        # Secrets are NOT exposed during installation.
        working-directory: .github/workflows
        run: |
          # Copy the package.json to use for installation
          cp openwiki-package.json package.json
          
          # If package-lock.json doesn't exist, generate it (first run only)
          # On subsequent runs, the committed lockfile ensures reproducible builds
          if [ ! -f openwiki-package-lock.json ]; then
            npm install --package-lock-only
            mv package-lock.json openwiki-package-lock.json
            echo "WARNING: Generated new lockfile. This should be committed to the repository."
          else
            cp openwiki-package-lock.json package-lock.json
          fi
          
          # Install using the lockfile for integrity-checked, reproducible installation
          npm ci

      - name: Run OpenWiki
        # Use npx to run from the local node_modules with locked dependencies.
        # Secrets are only exposed to this execution step, not the installation step.
        # The GitHub token is not persisted in .git/config due to persist-credentials: false.
        run: npx --prefix .github/workflows openwiki code --update --print
        env:
          # OpenWiki sends anonymous reliability telemetry from CI runs.
          # Uncomment to disable:
          # OPENWIKI_TELEMETRY_DISABLED: "1"
          # TODO: Replace with your preferred inference provider and model
          OPENWIKI_PROVIDER: openrouter
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENWIKI_MODEL_ID: z-ai/glm-5.2
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGCHAIN_PROJECT: openwiki
          LANGCHAIN_TRACING_V2: "true"

      - name: Create OpenWiki update pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          # Provide token explicitly since persist-credentials is disabled for security
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            openwiki
            AGENTS.md
            CLAUDE.md
            .github/workflows/openwiki-update.yml
            .github/workflows/openwiki-package-lock.json
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update.

            This PR was generated by the scheduled OpenWiki workflow.
