[build-system]
requires = ["setuptools>=61.0", "setuptools-rust>=1.6.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eaqts"
version = "6.0.0"
description = "ELITE QUANTUM AUTONOMOUS TRADING SYSTEM (EAQTS VERSION 6.0)"
authors = [
    { name = "Simon Peter", email = "author@tsyslabs.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "pydantic>=2.0.0",
    "requests>=2.28.0",
    "websockets>=11.0",
]

[tool.setuptools]
packages = ["institutional_integrations"]

[tool.setuptools-rust]
ext_modules = [
    { target = "eaqts_rust_core", path = "eaqts_rust_core/Cargo.toml", binding = "PyO3" }
]

[tool.ruff]
target-version = "py310"
line-length = 120
select = ["E", "F", "W", "C90", "I", "N", "UP", "YTT", "ASYNC", "S", "BLE", "FBT", "B", "A", "COM", "C4", "DTZ", "T10", "DJ", "EM", "EXE", "FA", "ISC", "ICN", "G", "INP", "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET", "SLF", "SLOT", "SIM", "TID", "TCH", "INT", "ARG", "PTH", "TD", "FIX", "ERA", "PD", "PGH", "PL", "TRY", "FLY", "NPY", "AIR", "PERF", "FURB", "LOG", "RUF"]
ignore = [
    "E501",   # Line too long
    "S101",   # Use of assert
    "BLE001", # Do not catch blind exception
    "DTZ005", # datetime.now() without tz
    "DTZ011", # date.today()
    "SIM102", # Nested if statements
    "SIM103", # Return negated condition
    "F401",   # Unused import
    "F403",   # Wildcard import
    "PLR0913",# Too many arguments
    "PLR2004",# Magic value comparison
    "T201",   # print found
    "ARG002", # Unused method argument
    "N802",   # Function name should be lowercase
    "N803",   # Argument name should be lowercase
    "N806",   # Variable name should be lowercase
]

[tool.ruff.lint.isort]
known-first-party = ["institutional_integrations", "brain", "connector", "database", "indicators", "main", "config"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = false
disable_error_code = ["import-untyped", "import-not-found", "var-annotated", "no-redef", "assignment", "misc"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --strict-markers -k 'not gui_integration'"
testpaths = ["."]
filterwarnings = [
    "ignore::SyntaxWarning:.*cerebro.*",
    "ignore::SyntaxWarning:.*backtrader.*",
    "ignore::DeprecationWarning",
]
