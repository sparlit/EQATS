[build-system]
requires = ["setuptools>=61.0", "setuptools-rust>=1.6.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eqats"
version = "10.4.0"
description = "ELITE QUANTUM AUTONOMOUS TRADING SYSTEM (EQATS VERSION 10.4)"
authors = [
    { name = "Simon Peter", email = "author@tsyslabs.com" }
]
readme = "README.md"
# Compatible with Python 3.12+ and Free-Threaded (No-GIL) PEP 703
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "pydantic>=2.0.0",
    "requests>=2.28.0",
    "websockets>=11.0",
]

[tool.setuptools]
packages = ["institutional_integrations"]

[tool.setuptools-rust]
ext_modules = [
    { target = "eqats_rust_core", path = "eqats_rust_core/Cargo.toml", binding = "PyO3" }
]

[tool.ruff]
# Target optimized Python 3.13 runtime compiler features
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E", "F", "W", "C90", "I", "N", "UP", "YTT", "ASYNC", "S", "BLE", "FBT", "B", "A", 
    "COM", "C4", "DTZ", "T10", "DJ", "EM", "EXE", "FA", "ISC", "ICN", "G", "INP", "PIE", 
    "T20", "PYI", "PT", "Q", "RSE", "RET", "SLF", "SLOT", "SIM", "TID", "TCH", "INT", 
    "ARG", "PTH", "TD", "FIX", "ERA", "PD", "PGH", "PL", "TRY", "FLY", "NPY", "AIR", 
    "PERF", "FURB", "LOG", "RUF"
]
ignore = [
    "E501",   # Line too long
    "S101",   # Use of assert
    "BLE001", # Do not catch blind exception
    "DTZ005", # datetime.now() without tz
    "DTZ011", # date.today()
    "SIM102", # Nested if statements
    "SIM103", # Return negated condition
    "F401",   # Unused import
    "F403",   # Wildcard import
    "PLR0913",# Too many arguments
    "PLR2004",# Magic value comparison
    "T201",   # print found
    "ARG002", # Unused method argument
    "N802",   # Function name should be lowercase
    "N803",   # Argument name should be lowercase
    "N806",   # Variable name should be lowercase
]

[tool.ruff.lint.isort]
known-first-party = ["institutional_integrations", "brain", "connector", "database", "indicators", "main", "config"]

[tool.mypy]
# Upgraded typing boundaries to strictly analyze Python 3.13 source states
python_version = "3.13"
ignore_missing_imports = true
exclude = ["build", "dist", "eqats.egg-info", ".eggs"]
# Corrected: Swapped false overrides to true constraints to support your --strict validation track
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
check_untyped_defs = true
# Removed sweeping error code suppressions to allow Nemotron-3 to track and rectify real anomalies
disable_error_code = ["import-untyped", "import-not-found"]

[tool.pytest.ini_options]
minversion = "7.0"
# Improved: Integrated hardware multi-threading flags (-n auto) directly into global config
addopts = "-n auto -vv -s --strict-markers -k 'not gui_integration' --cache-clear"
testpaths = ["."]
filterwarnings = [
    "ignore::SyntaxWarning:.*cerebro.*",
    "ignore::SyntaxWarning:.*backtrader.*",
    "ignore::DeprecationWarning",
]
markers = [
    "gui_integration: Marks slow interface integration tests to be filtered out during parallel CI rounds"
]
