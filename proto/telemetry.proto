syntax = "proto3";

package eaqts.telemetry;

message SystemVitalsPayload {
  double timestamp = 1;
  double cpu_usage_pct = 2;
  double ram_usage_mb = 3;
  double ram_usage_pct = 4;
  int32 active_processes = 5;
  int32 active_threads = 6;

  // Database & Microservice Connection Health
  bool postgres_connected = 7;
  bool clickhouse_connected = 8;
  bool valkey_connected = 9;
  bool pulsar_connected = 10;
  bool grpc_connected = 11;

  // Latency & Throughput Metrics
  double execution_latency_us = 12;
  double db_query_latency_ms = 13;
  int64 event_bus_throughput_msg_sec = 14;

  // Risk & Circuit Breaker Status
  bool circuit_breaker_tripped = 15;
  double active_drawdown_pct = 16;
  int32 active_agent_swarm_count = 17;
}

message TelemetryStreamRequest {
  int32 interval_ms = 1;
}

service TelemetryService {
  rpc StreamSystemVitals (TelemetryStreamRequest) returns (stream SystemVitalsPayload);
}
