name: AI PR Reviewer
on:
  pull_request:
    types: [opened, synchronize] # Runs on new PRs and every new commit push

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # Allows the AI to post inline comments
      contents: read
    steps:
      - name: Checkout base branch configuration
        uses: actions/checkout@v4
        with:
          # Pin configuration to base branch to prevent credential exfiltration
          # This ensures .ai-review.yaml comes from the trusted base, not the PR
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: |
            .ai-review.yaml
            .github/workflows/.ai-review.yaml
          sparse-checkout-cone-mode: false
          path: base-config

      - name: Checkout PR code for review
        uses: actions/checkout@v4
        with:
          # Checkout PR code for the action to review
          ref: ${{ github.event.pull_request.head.sha }}
          # Disable cleanup to preserve the base-config directory from the previous checkout
          clean: false

      - name: Overwrite PR configuration with trusted base configuration
        run: |
          # Use configuration from base branch, not from PR
          # This prevents attackers from modifying api_url or api_token to exfiltrate credentials
          # SECURITY: Fail closed if trusted configuration is not found
          if [ -f base-config/.ai-review.yaml ]; then
            cp base-config/.ai-review.yaml .ai-review.yaml
            echo "✓ Using .ai-review.yaml from base branch"
          elif [ -f base-config/.github/workflows/.ai-review.yaml ]; then
            cp base-config/.github/workflows/.ai-review.yaml .ai-review.yaml
            echo "✓ Using .github/workflows/.ai-review.yaml from base branch"
          elif [ -f .ai-review.yaml ]; then
            echo "✓ Using existing root .ai-review.yaml"
          else
            echo "ERROR: No trusted .ai-review.yaml found in base branch"
            echo "The base-config directory may have been cleaned up or the configuration file does not exist"
            echo "This is a security-critical failure - cannot proceed with PR-controlled configuration"
            exit 1
          fi

          # Verify the trusted configuration was successfully copied
          if [ ! -f .ai-review.yaml ]; then
            echo "ERROR: Failed to copy trusted configuration to .ai-review.yaml"
            exit 1
          fi

          echo "✓ Trusted configuration successfully applied"

      - name: Run AI Code Reviewer
        uses: Nikita-Filonov/ai-review@e3e19d6d06c4ee6951c7a132d2a1090f8b04a947 # main # Or another marketplace alternative
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPENAI_KEY || secrets.YOUR_OPENAI_OR_CLAUDE_KEY }}
