name: Quant Stack SDLC Automation

on:
  workflow_dispatch:

jobs:
  sdlc_lifecycle_pipeline:
    name: Execute Standalone Code Engine
    runs-on: ubuntu-latest
    steps:
      - name: Transparent Wrapper Entrypoint
        env:
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          # 1. Initialize space manually without hitting check out helper restrictions
          git init .
          git remote add origin "https://github.com{GH_REPOSITORY}.git"
          git fetch --no-tags --prune --depth=1 origin "refs/heads/main"
          git checkout --progress --force "FETCH_HEAD"
          
          # 2. Hand off full orchestration directly to our root workspace logic
          bash ./run_verification.sh
