name: EQATS Continuous Ingestion Factory Engine

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  run-ingestion-factory:
    runs-on: ubuntu-latest
    env:
      UNSAFE_PYO3_BUILD_FREE_THREADED: 1
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Root Workspace Core
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Initialize Dedicated Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup Multi-Threaded Native Compiler Utilities
        uses: dtolnay/rust-toolchain@stable

      - name: Initialize Isolated Project Virtual Environment
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=${{ github.workspace }}/.venv" >> $GITHUB_ENV
          echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH

      - name: Initialize Project Tools Matrix
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-xdist maturin pyo3-pack requests pytz

      - name: Execute Resilient Self-Healing Processing Loop
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          echo "[+] Launching EQATS Autonomous Ingestion Cycle..."
          
          if [ -d "_tmp_workspace" ]; then
              rm -rf _tmp_workspace/
          fi
          
          python3 .github/scripts/autonomous_factory.py
          ENGINE_STATUS=$?
          
          git config --global user.name "EQATS Ingestion Engine"
          git config --global user.email "factory-engine@eqats.internal"
          
          git stash -u || true
          
          if [ $ENGINE_STATUS -ne 0 ]; then
              echo "[-] Ingestion Factory encountered an error ($ENGINE_STATUS)."
              git pull origin main --rebase -X theirs || true
              git stash pop || true
              git add .
              git commit -m "EQATS Engine Auto-Fix: Resolving ledger index states [Time: $(date +%s)]" || true
              git push origin main || true
          else
              echo "[+] Active repository block compiled successfully. Freezing assets..."
              git pull origin main --rebase -X theirs || true
              git stash pop || true
              git add .
              
              if ! git diff-index --quiet HEAD; then
                git commit -m "EQATS Engine Progress: Advanced repository integration index" || true
              fi
              git push origin main || true
          fi

      - name: Programmatic Self-Trigger Automation Loop
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 .github/scripts/trigger_loop.py
