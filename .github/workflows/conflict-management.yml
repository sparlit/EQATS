name: Conflict Management & Auto-Labeling

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main, master]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  auto-label-conflicts:
    name: Auto Label Merge Conflicts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Label Merge Conflicts
        uses: prince-chrismc/label-merge-conflicts-action@v3
        continue-on-error: true
        with:
          conflict_label_name: "has conflict"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          detect_merge_changes: false
          conflict_comment: |
            :wave: Hi @${author},
            I detected conflicts against the base branch. Please sync your branch with upstream.

  auto-resolve-conflicts:
    name: Auto Resolve Conflicts (Theirs)
    if: github.event_name == 'pull_request' && github.event.label.name == 'auto-merge-theirs'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Pull and Force Merge (Theirs)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HEAD_BRANCH="${{ github.event.pull_request.head.ref }}"
          BASE_BRANCH="${{ github.event.pull_request.base.ref }}"

          git checkout $HEAD_BRANCH
          if ! git merge origin/$BASE_BRANCH -X theirs -m "chore: auto-resolved conflicts favoring theirs"; then
            echo "Merge failed even with conflict strategy. Manual intervention required."
            exit 1
          fi
          git push origin $HEAD_BRANCH

      - name: Remove Label
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} --remove-label "auto-merge-theirs"
