name: Conflict Management & Auto-Labeling

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main, master]

permissions: {}

jobs:
  auto-label-conflicts:
    name: Auto Label Merge Conflicts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Label Merge Conflicts
        uses: prince-chrismc/label-merge-conflicts-action@21e6705eaa6aab66e4e486279389c8e3e4c465b7 # v3
        continue-on-error: true
        with:
          conflict_label_name: "has conflict"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          detect_merge_changes: false
          conflict_comment: |
            :wave: Hi @${author},
            I detected conflicts against the base branch. Please sync your branch with upstream.

  auto-resolve-conflicts:
    name: Auto Resolve Conflicts (Theirs)
    if: github.event_name == 'pull_request' && github.event.label.name == 'auto-merge-theirs'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Pull and Force Merge (Theirs)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          GH_REPO: ${{ github.repository }}
        run: |
          git checkout "$HEAD_BRANCH"
          if ! git merge "origin/$BASE_BRANCH" -X theirs -m "chore: auto-resolved conflicts favoring theirs"; then
            echo "Merge failed even with conflict strategy. Manual intervention required."
            exit 1
          fi
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" "HEAD:${HEAD_BRANCH}"

      - name: Remove Label
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr edit "$PR_NUMBER" --remove-label "auto-merge-theirs"
