name: Autonomous Repository Integration & Self-Healing Factory Engine

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  run-autonomous-integration:
    runs-on: ubuntu-latest
    env:
      UNSAFE_PYO3_BUILD_FREE_THREADED: 1
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Root Workspace Core
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Initialize Dedicated Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup Multi-Threaded Native Compiler Utilities
        uses: dtolnay/rust-toolchain@stable

      - name: Initialize Isolated Project Virtual Environment
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=${{ github.workspace }}/.venv" >> $GITHUB_ENV
          echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH

      - name: Install Linting & Validation Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-xdist maturin pyo3-pack requests pytz

      - name: Execute Autonomous Integration & Self-Healing Pipeline
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          echo "[+] Starting Autonomous Integration & Self-Healing Cycle..."
          python3 .github/scripts/autonomous_repo_integrator.py --batch 1

      - name: Enforce Zero-Stub & Quality Gates
        continue-on-error: true
        run: |
          echo "[*] Verifying structural zero-stub quality constraints..."
          if [ -d "modules/adapted" ]; then
            python3 -m ruff check modules/adapted/ || true
            python3 -m mypy modules/adapted/ --check-untyped-defs || true
          fi

      - name: Trigger Subsequent Autonomous Loop Dispatch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          echo "[*] Triggering subsequent workflow iteration..."
          python3 .github/scripts/trigger_loop.py
