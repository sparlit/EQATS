name: Jules Trading System Pyflakes Fixer

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  pyflakes-analysis:
    name: Pyflakes Check & Automated Refactoring Mesh
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      statuses: write

    steps:
      - name: Checkout Trading System Codebase
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-level: "3.11"

      - name: Install Linting & Primitives
        run: |
          python -m pip install --upgrade pip
          pip install pyflakes

      - name: Run Pyflakes & Capture Diagnostics
        id: run_pyflakes
        run: |
          echo "=== Executing Pyflakes Static Analysis ==="
          # Run pyflakes, output to log, but prevent hard failure here so Jules can ingest it
          pyflakes . > pyflakes_errors.log 2>&1 || true
          cat pyflakes_errors.log
          
      - name: Verify Pyflakes Analysis Output
        run: |
          echo "=== Pyflakes Analysis Diagnostics ==="
          if [ -s pyflakes_errors.log ]; then
            echo "Pyflakes warnings/errors detected:"
            cat pyflakes_errors.log
          else
            echo "Zero Pyflakes static analysis issues detected."
          fi
