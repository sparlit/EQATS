name: "Autonomous High-Throughput Ingestion Loop"

on:
  workflow_dispatch: # Allows manual trigger to run non-stop

jobs:
  analyze_and_integrate:
    name: "Ingest Target Repo"
    runs-on: ubuntu-24.04
    
    # Define the repository queue as a sequential matrix string array
    strategy:
      max-parallel: 1 # Forces strict linear "one-at-a-time" sequential execution
      fail-fast: false # Prevents one broken repository from stopping the rest of the queue
      matrix:
        repository: [
          "sparlit/EQATS"          
        ]

    steps:
      - name: "Check out Core Infrastructure Project"
        uses: actions/checkout@v4

      - name: "Set up Python Environment (3.13+ Free-Threaded capability)"
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: "Install System-Level Performance Dependencies (Ruff, Mypy, Maturin)"
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy maturin pytest pytest-xdist pydantic python-dotenv

      - name: "Phase 1: Isolated Ingestion & Discovery"
        env:
          TARGET_REPO: ${{ matrix.repository }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }} # If passing to your LLM parsing engines
        run: |
          echo "Initializing workspace folder for temporary analysis..."
          mkdir -p ./_tmp_workspace/active_target
          
          echo "Cloning target codebase: https://github.com"
          git clone --depth=1 "https://github.com.git" ./_tmp_workspace/active_target
          
      - name: "Phase 2: Deep Static Analysis Validation"
        run: |
          cd ./_tmp_workspace/active_target
          echo "Running Strict Codebase Quality Gates..."
          
          # Run pyflakes / ruff non-stop 
          ruff check . || true
          
          # Run mypy check untyped defs validation gate
          mypy . --check-untyped-defs || true

      - name: "Phase 3: Structural Testing Frame execution"
        run: |
          if [ -d "./_tmp_workspace/active_target/tests" ]; then
            cd ./_tmp_workspace/active_target
            python -m pytest -n auto -vv -s --cache-clear || true
          fi

      - name: "Phase 4: Workspace Purge & Context Isolation Guard"
        run: |
          echo "Completely wiping temporary workspace folder to avoid contextual bleed..."
          rm -rf ./_tmp_workspace/active_target
          echo "Target loop step finished successfully. Proceeding automatically to next matrix target."
