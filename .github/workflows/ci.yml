name: CI/CD Build Pipeline

on:
  push:
    branches: [ main, master, "refactor/*", "feature/*" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Code Quality & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linting & Type Checking Tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pyflakes mypy ruff

      - name: Run Ruff Code Linter
        run: |
          ruff check . --exit-zero

      - name: Run Pyflakes Analysis
        run: |
          pyflakes indicators.py main.py brain.py connector.py database.py gui.py predictive_brain.py eqats_planes.py institutional_integrations/comprehensive_suite.py institutional_integrations/web_api.py institutional_integrations/databases.py

      - name: Run Mypy Type Checking
        run: |
          mypy --config-file mypy.ini .

  rust-core:
    name: Rust Core Compilation & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: eqats_rust_core

      - name: Run Cargo Format Check
        run: |
          cargo fmt --manifest-path eqats_rust_core/Cargo.toml --check

      - name: Run Cargo Clippy Linter
        run: |
          cargo clippy --manifest-path eqats_rust_core/Cargo.toml --all-targets -- -A clippy::not_unsafe_ptr_arg_deref -A clippy::needless_range_loop

      - name: Run Rust Core Unit Tests
        run: |
          cargo test --manifest-path eqats_rust_core/Cargo.toml --verbose

  python-tests:
    name: Python Test Suite Execution
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Rust Toolchain for PyO3 Extension Build
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: eqats_rust_core

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pytest pytest-xdist

      - name: Build and Install PyO3 Extension Core
        run: |
          pip install -e .

      - name: Run Pytest Test Suite
        run: |
          python -m pytest -vv -s -k "not gui_integration"

  build-artifacts:
    name: Package Release Artifacts
    needs: [lint-and-typecheck, rust-core, python-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: eqats_rust_core

      - name: Install Build Tooling
        run: |
          python -m pip install --upgrade pip setuptools setuptools-rust wheel build

      - name: Build Distribution Packages (Wheel & SDist)
        run: |
          python -m build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eqats-distribution-packages
          path: dist/*
          retention-days: 14
