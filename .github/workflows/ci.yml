name: CI Pipeline

on:
  push:
    branches: [ main, master, "refactor/*", "feature/*" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-and-lint:
    name: Test & Lint Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pyflakes mypy ruff pytest

      - name: Build Rust extension core
        run: |
          pip install -e .

      - name: Run Pyflakes Linter Check
        run: |
          pyflakes indicators.py main.py brain.py connector.py database.py gui.py predictive_brain.py eaqts_planes.py institutional_integrations/comprehensive_suite.py institutional_integrations/web_api.py institutional_integrations/databases.py

      - name: Run Mypy Type Analysis
        run: |
          mypy --config-file mypy.ini .

      - name: Run Pytest Test Suite
        run: |
          python -m pytest -vv -s -k "not gui_integration"
