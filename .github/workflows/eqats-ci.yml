name: eqats-ci
on:
  pull_request:
  push:
    branches: [ "**" ]
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cargo build
        run: |
          if [ -f Cargo.toml ]; then cargo build --verbose; else echo "no Cargo.toml, skipping"; fi
      - name: Cargo test
        run: |
          if [ -f Cargo.toml ]; then cargo test --verbose; else echo "no Cargo.toml, skipping"; fi
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install & test
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then pip install maturin pytest && (maturin build || true); fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -d tests ] || ls -1 **/test_*.py >/dev/null 2>&1; then pytest -q || true; else echo "no python tests"; fi
