name: Auto-Update README Documentation

on:
  push:
    branches:
      - main  # Runs whenever code is pushed to the main branch
  issues:
    types: [opened, edited, closed] # Runs whenever you update GitHub Issues
  workflow_dispatch: # Allows you to trigger it manually via the GitHub UI

permissions:
  contents: write  # Crucial: Gives the Action permission to modify files in your repo

jobs:
  refresh-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Execute Update Script
        run: python generate-readme.py

      - name: Commit and Push to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add README.md
          # Only commit if the README actually changed, preventing infinite build loops
          git diff-index --quiet HEAD || git commit -m "docs: automated timeline and roadmap update [skip ci]"
          git push
