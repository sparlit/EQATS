name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ".github/workflows/openwiki-package-lock.json"

      - name: Install OpenWiki with locked dependencies
        working-directory: .github/workflows
        run: |
          cp openwiki-package.json package.json

          if [ ! -f openwiki-package-lock.json ]; then
            echo "ERROR: openwiki-package-lock.json not found."
            exit 1
          fi

          cp openwiki-package-lock.json package-lock.json
          npm ci

      - name: Create OpenWiki exclusion configuration
        run: |
          cat > .openwikiignore << 'EOF'
          **/SECURITY*.md
          **/CREDENTIALS*.md
          **/*_CREDENTIALS*.md
          **/*credentials*.py
          **/*secrets*.py
          migrate_credentials.py

          *.db
          *.db-journal
          *.db-shm
          *.db-wal

          .env
          .env.*
          **/*.env
          config.py

          test_credential*.py
          test_*_security.py

          __pycache__/
          *.pyc
          node_modules/
          .venv/
          target/
          *.exe
          *.pyd

          *.log
          council_logs/

          src/institutional_integrations/
          brain*.py
          predictive_brain.py
          eqats_planes.py
          indicators.py

          *.ex5
          *.mq5
          eqats_rust_core/

          ft.txt
          EOF

      - name: Run OpenWiki
        run: |
          if [ -z "${{ secrets.NVIDIA_API_KEY }}" ]; then
            echo "[WARNING] NVIDIA_API_KEY secret is not set. Bypassing live OpenWiki generation."
          else
            npx --prefix .github/workflows openwiki code --update --print
          fi
        env:
          OPENWIKI_PROVIDER: nvidia
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENWIKI_MODEL_ID: "nvidia/nemotron-3-ultra-550b-a55b"
          OPENWIKI_LANGSMITH_API_KEY: ${{ secrets.OPENWIKI_LANGSMITH_API_KEY }}

      - name: Upload generated changes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openwiki-changes
          path: |
            openwiki/
            AGENTS.md
            CLAUDE.md
            .github/workflows/openwiki-update.yml
            .github/workflows/openwiki-package-lock.json
          retention-days: 1
          if-no-files-found: ignore

  create-pr:
    runs-on: ubuntu-latest
    needs: generate
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false

      - name: Download generated changes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openwiki-changes
          path: .

      - name: Create OpenWiki update pull request
        uses: peter-evans/create-pull-request@67ccf181d831fe66722d3e7534d0b13cf793fbfa # v7.0.8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            openwiki
            AGENTS.md
            CLAUDE.md
            .github/workflows/openwiki-update.yml
            .github/workflows/openwiki-package-lock.json
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update.

            This PR was generated by the scheduled OpenWiki workflow.
