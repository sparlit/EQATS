name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

# Default to read-only permissions for all jobs. Write permissions are granted
# only to the create-pr job, isolating repository-write capability from third-party
# code execution during package installation and OpenWiki generation.
permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    # This job runs third-party code (npm packages, OpenWiki) with read-only
    # permissions. No repository-write token is available to compromised dependencies.
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Disable credential persistence to prevent installed packages from
          # accessing the GitHub token via .git/config
          persist-credentials: false
          # Full history so `openwiki code --update` can diff HEAD against the
          # commit it last documented; a shallow clone hides that commit and the
          # update runs against an empty change summary.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install OpenWiki with locked dependencies
        # Use a committed package.json and package-lock.json for reproducible builds.
        # This ensures all transitive dependencies are pinned and integrity-checked.
        # No write-capable token is available during installation.
        working-directory: .github/workflows
        run: |
          # Copy the package.json to use for installation
          cp openwiki-package.json package.json

          # Require a committed lockfile to prevent runtime dependency resolution.
          # Generating the lockfile at runtime would allow transitive dependencies
          # to be resolved from the live npm registry, enabling supply-chain attacks
          # via compromised packages that execute code during npm ci installation.
          if [ ! -f openwiki-package-lock.json ]; then
            echo "ERROR: openwiki-package-lock.json not found."
            echo ""
            echo "For security, this workflow requires a committed lockfile to ensure"
            echo "all transitive dependencies are reviewed and integrity-checked before"
            echo "installation. Generating the lockfile at runtime would allow untrusted"
            echo "code execution via compromised npm packages."
            echo ""
            echo "To generate the lockfile in a controlled environment:"
            echo "  cd .github/workflows"
            echo "  cp openwiki-package.json package.json"
            echo "  npm install --package-lock-only"
            echo "  mv package-lock.json openwiki-package-lock.json"
            echo "  rm package.json"
            echo "  git add openwiki-package-lock.json"
            echo "  git commit -m 'chore: add OpenWiki dependency lockfile'"
            echo ""
            exit 1
          fi

          # Copy the committed lockfile
          cp openwiki-package-lock.json package-lock.json

          # Install using the lockfile for integrity-checked, reproducible installation
          npm ci

      - name: Create OpenWiki exclusion configuration
        # Configure path exclusions to prevent sensitive files from being sent to external services.
        # This mitigates the risk of credential leakage, proprietary code exposure, and
        # unintended data transfer to third-party inference and tracing providers.
        run: |
          cat > .openwikiignore << 'EOF'
          # Exclude sensitive credential and security files
          **/SECURITY*.md
          **/CREDENTIALS*.md
          **/*_CREDENTIALS*.md
          **/*credentials*.py
          **/*secrets*.py
          migrate_credentials.py

          # Exclude database files that may contain sensitive data
          *.db
          *.db-journal
          *.db-shm
          *.db-wal

          # Exclude environment and configuration files
          .env
          .env.*
          **/*.env
          config.py

          # Exclude test files that may contain mock credentials
          test_credential*.py
          test_*_security.py

          # Exclude build artifacts and dependencies
          __pycache__/
          *.pyc
          node_modules/
          .venv/
          target/
          *.exe
          *.pyd

          # Exclude logs that may contain sensitive runtime data
          *.log
          council_logs/

          # Exclude proprietary trading strategies and algorithms
          institutional_integrations/
          brain*.py
          predictive_brain.py
          eqats_planes.py
          indicators.py

          # Exclude compiled binaries and Rust code
          *.ex5
          *.mq5
          eqats_rust_core/

          # Exclude API integration files that may contain keys
          ft.txt
          EOF

      - name: Run OpenWiki
        run: npx --prefix .github/workflows openwiki code --update --print
        env:
          OPENWIKI_PROVIDER: nvidia
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENWIKI_MODEL_ID: "nvidia/nemotron-3-ultra-550b-a55b"
          OPENWIKI_LANGSMITH_API_KEY: ${{ secrets.OPENWIKI_LANGSMITH_API_KEY }}

      - name: Upload generated changes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openwiki-changes
          path: |
            openwiki/
            AGENTS.md
            CLAUDE.md
            .github/workflows/openwiki-update.yml
            .github/workflows/openwiki-package-lock.json
          retention-days: 1
          if-no-files-found: ignore

  create-pr:
    runs-on: ubuntu-latest
    needs: generate
    # This job has write permissions but does not execute third-party code.
    # It only downloads artifacts and creates a pull request.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Credential persistence is acceptable here since no third-party code runs,
          # but we disable it for defense in depth.
          persist-credentials: false

      - name: Download generated changes
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: openwiki-changes
          path: .

      - name: Create OpenWiki update pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          # Provide token explicitly since persist-credentials is disabled
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            openwiki
            AGENTS.md
            CLAUDE.md
            .github/workflows/openwiki-update.yml
            .github/workflows/openwiki-package-lock.json
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update.

            This PR was generated by the scheduled OpenWiki workflow.
