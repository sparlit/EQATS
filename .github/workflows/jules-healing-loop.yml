name: Jules Automated Fix Loop

on:
  push:
    branches:
      - 'ai-fix-/*'       # Restricts the loop to designated feature branches for safety
  workflow_dispatch:      # Allows manual triggers from the GitHub Actions UI

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    outputs:
      tests_failed: ${{ steps.run-tests.outputs.failed }}
      error_logs: ${{ steps.run-tests.outputs.logs }}
    
    steps:
      # 1. Upgraded to v5 to support the Node 24 runtime natively
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v5.2.2

      # 2. Upgraded to v6 to completely fix the Node 20 deprecation warning
      - name: Setup Python Environment
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v6.3.0
        with:
          python-version: '3.11' # Change to your required Python version
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 3. Runs your Python test suite (e.g., pytest)
      - name: Run Test Suite
        id: run-tests
        run: |
          if pytest > test_output.log 2>&1; then
            echo "✅ Tests passed! No action required."
            echo "failed=false" >> $GITHUB_OUTPUT
          else
            echo "❌ Tests failed. Storing logs for Jules."
            echo "failed=true" >> $GITHUB_OUTPUT
            
            # Compress log slightly to safely inject into environment variables
            CLEAN_LOGS=$(tail -n 40 test_output.log | tr '\n' ' ')
            echo "logs=$CLEAN_LOGS" >> $GITHUB_OUTPUT
          fi

  invoke-jules:
    needs: test-and-validate
    if: needs.needs.test-and-validate.outputs.tests_failed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write     # Gives the environment permission to receive code updates

    steps:
      - name: Summon Jules Agent
        # SECURITY: Pinned to immutable commit SHA instead of mutable @v1 tag
        # To update: Visit https://github.com/google-labs-code/jules-invoke/releases
        # Review the changes, then update the SHA below to the reviewed commit
        uses: google-labs-code/jules-invoke@b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0 # v1.x.x
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          branch: ${{ github.ref_name }}
          prompt: |
            The test suite in our repository failed on this branch. 
            
            Error logs from the test runner:
            ${{ needs.test-and-validate.outputs.error_logs }}

            Instructions:
            1. Spin up the environment and re-verify these errors.
            2. Analyze the relevant codebase files causing the failure.
            3. Rewrite and correct the broken logic.
            4. Ensure tests run successfully in your environment.
            5. Commit and push the successful corrections back to this exact branch.
