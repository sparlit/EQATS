name: Jules Continuous Innovation & Automerge Loop

on:
  push:
    branches:
      - 'ai-optimize-/*'   # Triggers automatically on pushes to these designated branches
  workflow_dispatch:        # Allows manual invocation from the GitHub Actions UI

jobs:
  analyze-enhance-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Grants Jules permission to push code updates
      pull-requests: write  # Crucial: Grants permissions to open and merge Pull Requests

    steps:
      # 1. Checkout the repository with full commit history to track the loop count
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 2. Check the commit history to break infinite loops (Max 5 consecutive AI iterations)
      - name: Enforce Circuit Breaker Limit
        id: loop-check
        run: |
          echo "🔄 Checking automation iteration count..."
          AI_COMMIT_COUNT=$(git log -n 6 --pretty=format:"%s" | grep -c "chore(ai-enhance):" || true)
          echo "Recent AI execution commits found: $AI_COMMIT_COUNT"
          
          if [ "$AI_COMMIT_COUNT" -ge 5 ]; then
            echo "🛑 Circuit Breaker Triggered: The loop has reached its maximum cap of 5 iterations."
            echo "continue_loop=false" >> $GITHUB_OUTPUT
          else
            echo "continue_loop=true" >> $GITHUB_OUTPUT
          fi

      # 3. Dynamic Versioning Mechanism: Auto-increment alphabetical suffix
      - name: Calculate Incremental Version
        if: steps.loop-check.outputs.continue_loop == 'true'
        id: calc-version
        run: |
          echo "🔢 Calculating subsequent system version mapping..."
          CURRENT_VERSION="8.4"
          
          if [ -f README.md ]; then
            FOUND_VER=$(grep -oP "(?<=ELITE QUANTUM AUTONOMOUS TRADING SYSTEM \(EQATS VERSION 8\.3)[a-z]" README.md | head -n1 || true)
            if [ -n "$FOUND_VER" ]; then
              CURRENT_VERSION="8.3$FOUND_VER"
            fi
          fi
          
          CHAR_SUFFIX="${CURRENT_VERSION:3:1}"
          NEXT_CHAR=$(printf \\$(printf '%03o' "$(( $(printf '%d' "'$CHAR_SUFFIX") + 1 ))"))
          NEXT_VERSION="8.3$NEXT_CHAR"
          
          echo "Current parsed baseline: EQATS v$CURRENT_VERSION"
          echo "Target incremental milestone: EQATS v$NEXT_VERSION"
          echo "next_version=$NEXT_VERSION" >> $GITHUB_OUTPUT

      # 4. Setup the open-source environment
      - name: Setup Python Environment
        if: steps.loop-check.outputs.continue_loop == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      # 5. Install dependencies and 100% FOSS Ruff + Bandit tooling
      - name: Install Tools & Dependencies
        if: steps.loop-check.outputs.continue_loop == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 6. Run verification tests to see if code is currently broken or functional
      - name: Run Test Suite Verification
        if: steps.loop-check.outputs.continue_loop == 'true'
        id: run-tests
        run: |
          if pytest > test_output.log 2>&1; then
            echo "status=HEALTHY" >> $GITHUB_OUTPUT
            echo "logs=All primary functional unit tests are currently passing successfully." >> $GITHUB_OUTPUT
          else
            echo "status=BROKEN" >> $GITHUB_OUTPUT
            CLEAN_LOGS=$(tail -n 25 test_output.log | tr '\n' ' ')
            echo "logs=$CLEAN_LOGS" >> $GITHUB_OUTPUT
          fi

      # 7. Run Ruff and Bandit to extract static evaluation context data
      - name: Run Linter and Security Analysis
        if: steps.loop-check.outputs.continue_loop == 'true'
        id: run-scanners
        run: |
          ruff check . --statistics > ruff_output.log 2>&1 || true
          bandit -r . -ll --format txt > bandit_output.log 2>&1 || true
          
          CLEAN_RUFF=$(tail -n 20 ruff_output.log | tr '\n' ' ')
          CLEAN_BANDIT=$(tail -n 20 bandit_output.log | tr '\n' ' ')
          
          echo "ruff=$CLEAN_RUFF" >> $GITHUB_OUTPUT
          echo "bandit=$CLEAN_BANDIT" >> $GITHUB_OUTPUT

      # 8. Invoke Jules to Expand Features, Innovate, Fix, Enhance, and Document
      - name: Invoke Jules Innovation Agent
        if: steps.loop-check.outputs.continue_loop == 'true'
        uses: google-labs-code/jules-action@v1
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          branch: ${{ github.ref_name }}
          prompt: |
            You are operating within an automated continuous innovation and optimization loop. Your goal is to systematically expand the system's capabilities by writing new features, optimization math modules, or execution components while maintaining flawless stability.
            
            TARGET BUILD MILESTONE VERSION: ${{ steps.calc-version.outputs.next_version }}
            Current Repository State: ${{ steps.run-tests.outputs.status }}
            
            Diagnostic Inputs:
            - Test Suite Log Context: ${{ steps.run-tests.outputs.logs }}
            - Ruff Linter Log Context: ${{ steps.run-scanners.outputs.ruff }}
            - Bandit Security Log Context: ${{ steps.run-scanners.outputs.bandit }}

            Execution Directives:
            1. ⚙️ FEATURE EXPANSION & CREATION: Analyze the system master blueprints and check lists (e.g., TODO task maps and design logs). Identify unbuilt sheets, incomplete mathematical planes, or stubbed integrations. Actively engineer, code, and deploy complete, highly functional Python/Rust algorithms and features to satisfy those design specs. Do not leave placeholder text or boilerplate code.
            2. 🛠️ MANDATORY FIXES: If the repo status is 'BROKEN', prioritize fixing the root causes behind unit test failures, security flaws, or lint errors.
            3. 📈 PERFORMANCE ENHANCEMENT: Refactor adjacent layers to maximize data-throughput speeds, simplify nested logic loops, and minimize computation bottlenecks.
            4. 🔢 VERSION STAMPING: Update any internal variables, config scripts, or GUI sheets to match the target release build version: ${{ steps.calc-version.outputs.next_version }}.
            5. 📝 DOCUMENTATION RECORDING: Scan all repository Markdown files (including README.md, audit papers, master plans, and task lists). Replace instances of old versions with '${{ steps.calc-version.outputs.next_version }}'. Append a rigorous changelog section specifying exactly what new code modules or mathematical functions you have built.
            
            Commit Message Requirement:
            - You MUST prefix your commit message exactly with: "chore(ai-enhance): release version ${{ steps.calc-version.outputs.next_version }}" so our loop counters track the execution.
            
            Verification: Ensure your new features are accompanied by corresponding unit tests, and that the whole test suite runs cleanly against the test runner before pushing back your final commit changes to this branch.

      # 9. AUTOMERGE PIPELINE: Open a Pull Request and set it to Auto-Merge into Main
      - name: Open and Automerge Pull Request
        if: steps.loop-check.outputs.continue_loop == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ github.ref_name }}
          TARGET_VERSION: ${{ steps.calc-version.outputs.next_version }}
        run: |
          echo "🚀 Initiating hands-free deployment pipeline..."
          
          PR_EXISTS=$(gh pr list --head "$BRANCH_NAME" --base main --json number --jq '..number' || true)
          
          if [ -z "$PR_EXISTS" ] || [ "$PR_EXISTS" = "null" ]; then
            echo "txt=No open PR found. Creating a new Pull Request..."
            PR_URL=$(gh pr create \
              --title "🚀 AI Auto-Innovation & Feature Release [v${TARGET_VERSION}]" \
              --body "This Pull Request was generated autonomously by your Jules Innovation Loop. It adds new quantitative trading features, expands microservice code modules, refactors layout sheets, and advances the system architecture baseline version to release ${TARGET_VERSION}." \
              --base main \
              --head "$BRANCH_NAME")
            PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$' | tail -n1)
          else
            echo "🔄 Active Pull Request #$PR_EXISTS already found for this branch."
            PR_NUMBER=$PR_EXISTS
          fi

          if [ -n "$PR_NUMBER" ]; then
            echo "🔒 Arming Automerge Sequence for PR #$PR_NUMBER..."
            gh pr merge "$PR_NUMBER" --auto --squash
            echo "✅ Automerge enabled successfully! Code will merge into main automatically."
          else
            echo "⚠️ Failed to resolve a valid Pull Request number. Skipping merge step."
          fi
