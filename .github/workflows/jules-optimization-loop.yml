name: Jules Continuous Enhancement Loop

on:
  push:
    branches:
      - 'ai-optimize-/*'   # Triggers automatically on pushes to these designated branches
  workflow_dispatch:        # Allows manual invocation from the GitHub Actions UI

jobs:
  analyze-and-enhance:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Grants Jules permission to push enhancements back to the repo

    steps:
      # 1. Checkout the repository with full commit history to allow history checking
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 2. Check the commit history to break infinite loops (Max 5 AI commits allowed)
      - name: Enforce Circuit Breaker Limit
        id: loop-check
        run: |
          echo "🔄 Checking automation iteration count..."
          # Count how many of the last 6 commits were generated by our AI action bot
          AI_COMMIT_COUNT=$(git log -n 6 --pretty=format:"%s" | grep -c "chore(ai-enhance):" || true)
          echo "Recent AI execution commits found: $AI_COMMIT_COUNT"
          
          if [ "$AI_COMMIT_COUNT" -ge 5 ]; then
            echo "🛑 Circuit Breaker Triggered: The loop has reached its maximum cap of 5 iterations."
            echo "Stopping to prevent infinite token consumption. Please review the code."
            echo "continue_loop=false" >> $GITHUB_OUTPUT
          else
            echo "continue_loop=true" >> $GITHUB_OUTPUT
          fi

      # 3. Setup the open-source environment
      - name: Setup Python Environment
        if: steps.loop-check.outputs.continue_loop == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      # 4. Install dependencies and the 100% FOSS Ruff + Bandit tooling
      - name: Install Tools & Dependencies
        if: steps.loop-check.outputs.continue_loop == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 5. Run verification tests to see if code is currently broken or functional
      - name: Run Test Suite Verification
        if: steps.loop-check.outputs.continue_loop == 'true'
        id: run-tests
        run: |
          if pytest > test_output.log 2>&1; then
            echo "status=HEALTHY" >> $GITHUB_OUTPUT
            echo "logs=All primary functional unit tests are currently passing successfully." >> $GITHUB_OUTPUT
          else
            echo "status=BROKEN" >> $GITHUB_OUTPUT
            CLEAN_LOGS=$(tail -n 25 test_output.log | tr '\n' ' ')
            echo "logs=$CLEAN_LOGS" >> $GITHUB_OUTPUT
          fi

      # 6. Run Ruff and Bandit to extract static evaluation context data
      - name: Run Linter and Security Analysis
        if: steps.loop-check.outputs.continue_loop == 'true'
        id: run-scanners
        run: |
          ruff check . --statistics > ruff_output.log 2>&1 || true
          bandit -r . -ll --format txt > bandit_output.log 2>&1 || true
          
          CLEAN_RUFF=$(tail -n 20 ruff_output.log | tr '\n' ' ')
          CLEAN_BANDIT=$(tail -n 20 bandit_output.log | tr '\n' ' ')
          
          echo "ruff=$CLEAN_RUFF" >> $GITHUB_OUTPUT
          echo "bandit=$CLEAN_BANDIT" >> $GITHUB_OUTPUT

      # 7. Invoke Jules to Fix Bugs AND proactively enhance the codebase
      - name: Invoke Jules Enhancement Agent
        if: steps.loop-check.outputs.continue_loop == 'true'
        uses: google-labs-code/jules-action@v1
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          branch: ${{ github.ref_name }}
          prompt: |
            You are operating within an automated continuous optimization loop. Your goal is to systematically fix errors and progressively enhance this codebase.
            
            Current Repository State: ${{ steps.run-tests.outputs.status }}
            
            Diagnostic Inputs:
            - Test Suite Log Context: ${{ steps.run-tests.outputs.logs }}
            - Ruff Linter Log Context: ${{ steps.run-scanners.outputs.ruff }}
            - Bandit Security Log Context: ${{ steps.run-scanners.outputs.bandit }}

            Execution Directives:
            1. 🛠️ MANDATORY FIXES: If the state is 'BROKEN', prioritize fixing the root causes behind the unit test failures, security flaws, or lint errors.
            2. 📈 CODE ENHANCEMENT: If the state is 'HEALTHY' (or once bugs are addressed), refactor the files to maximize quality. Look for bottlenecks, simplify highly nested logic, improve variable naming, and optimize performance.
            3. 🧼 CODE MODULARITY: Extract repetitive blocks into clean, reusable utility components where appropriate.
            
            Commit Message Requirement:
            - You MUST prefix your commit message exactly with: "chore(ai-enhance): " so our circuit breaker can keep track of loop cycles.
            
            Verification: Ensure your enhancements run cleanly against the test runner before pushing back your final commit changes to this branch.
