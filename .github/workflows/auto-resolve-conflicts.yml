name: Auto-Resolve Merge Conflicts

on:
  pull_request:
    types: [labeled]

jobs:
  resolve-conflicts:
    if: github.event.label.name == 'auto-merge-theirs'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"

      - name: Pull and Force Merge (Theirs)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch the head (source) and base (target) branch names
          HEAD_BRANCH="${{ github.event.pull_request.head.ref }}"
          BASE_BRANCH="${{ github.event.pull_request.base.ref }}"
          
          echo "Target Branch: $BASE_BRANCH"
          echo "Source Branch: $HEAD_BRANCH"
          
          # Checkout the source feature branch
          git checkout $HEAD_BRANCH
          
          # Attempt to merge the base branch using the 'theirs' strategy
          # This forces all files to accept the source branch's changes
          if ! git merge origin/$BASE_BRANCH -X theirs -m "chore: auto-resolved conflicts favoring theirs"; then
            echo "Merge failed even with conflict strategy. Manual intervention required."
            exit 1
          fi
          
          # Push the fixed branch back to GitHub
          git push origin $HEAD_BRANCH

      - name: Remove Label
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} --remove-label "auto-merge-theirs"
