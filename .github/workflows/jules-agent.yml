name: Jules Autonomous Engineering Agent

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  jules-healing-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Project Prerequisites
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-xdist pytest-repeat
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Test Suite Matrix
        id: run-tests
        continue-on-error: true # Ensure the runner continues so it can delegate fixes to Jules
        run: |
          python -m pytest -n auto -vv -s --count=100 --full-trace --cache-clear -k "not gui_integration"

      - name: Delegate Failures to Jules
        if: steps.run-tests.outcome == 'failure'
        uses: google-beta/jules-action@v1
        with:
          # Google Cloud identity authentication tokens
          jules_api_token: ${{ secrets.JULES_API_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          task_instruction: |
            The EQATS automated test suite has failed. Review the codebase and fix the root causes.
            
            CRITICAL RUNTIME COMMAND TO VERIFY YOUR FIXES:
            python -m pytest -n auto -vv -s --count=100 --full-trace --cache-clear -k "not gui_integration"
            
            INVARIANT RULES:
            Ensure none of your structural changes violate system invariants INV-001 through INV-015 defined in the repository documentation.
