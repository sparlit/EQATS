name: Auto Approve PRs

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write

jobs:
  approve:
    runs-on: ubuntu-latest
    # Optional: Only approve PRs from specific actors or bots
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Auto Approve
        uses: hmarr/auto-approve-action@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          review-message: "Automated verification successful. Approved by AI Master Pipeline."
