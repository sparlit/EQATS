name: Automated Refactoring Loop

on:
  workflow_dispatch: # Allows you to start the process manually
  repository_dispatch:
    types: [continue-refactor] # Allows the workflow to call itself

jobs:
  refactor-step:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Crucial: Allows GitHub to commit changed code back to your repo

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        # Security: Disable credential persistence to prevent compromised packages
        # from accessing repository credentials during installation or execution
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a20 # v5.3.0
      with:
        python-version: '3.10'

    - name: Install Refactoring Tools
      run: |
        # Security: Install pinned versions with hash verification to prevent
        # supply-chain attacks from compromised PyPI packages
        pip install --require-hashes -r .github/workflows/refactor-requirements.txt

    - name: Parse Plan, Execute, and Update Markdown
      id: process_task
      env:
        # Security: Disable Git hooks globally to prevent token exfiltration
        # This prevents repository-controlled hooks from executing during git operations
        GIT_CONFIG_GLOBAL: /dev/null
        GIT_CONFIG_NOSYSTEM: 1
      run: |
        # Security: Disable Git hooks before any repository-controlled code executes
        # This prevents hooks from being invoked during credentialed git operations
        git config --global core.hooksPath /dev/null
        
        python - << 'EOF'
        import re
        import os
        import subprocess
        import shlex
        import sys

        PLAN_FILE = "instructions.md"

        # Security: Allowlist of permitted commands for refactoring operations
        # Only these base commands are allowed to execute
        ALLOWED_COMMANDS = {
            'black', 'isort', 'autopep8', 'pylint', 'flake8', 'mypy',
            'prettier', 'eslint', 'rustfmt', 'gofmt', 'clang-format',
            'sed', 'awk', 'grep', 'find', 'xargs', 'cat', 'echo',
            'python', 'python3', 'node', 'npm', 'pip', 'poetry',
            'cargo', 'go', 'make', 'cmake'
        }

        # Security: Paths that must never be modified
        PROTECTED_PATHS = {
            '.github/workflows/',
            '.git/',
            'secrets/',
            'credentials/'
        }

        # Security: File extensions that are allowed to be modified
        ALLOWED_EXTENSIONS = {
            '.py', '.js', '.ts', '.jsx', '.tsx', '.java', '.c', '.cpp', '.h',
            '.hpp', '.rs', '.go', '.rb', '.php', '.cs', '.swift', '.kt',
            '.md', '.txt', '.json', '.yaml', '.yml', '.toml', '.xml', '.html',
            '.css', '.scss', '.sass', '.less', '.sh', '.bash'
        }

        def validate_command(cmd_line):
            """
            Security: Validate that a command is safe to execute.
            Returns (is_valid, parsed_args) or (False, error_message)
            """
            if not cmd_line or not cmd_line.strip():
                return False, "Empty command"
            
            # Parse the command safely
            try:
                args = shlex.split(cmd_line)
            except ValueError as e:
                return False, f"Invalid command syntax: {e}"
            
            if not args:
                return False, "No command provided"
            
            base_cmd = os.path.basename(args[0])
            
            # Check if base command is in allowlist
            if base_cmd not in ALLOWED_COMMANDS:
                return False, f"Command '{base_cmd}' is not in the allowlist"
            
            # Security: Block dangerous flags and patterns
            dangerous_patterns = [
                '--eval', '-e', 'eval', 'exec', '__import__',
                'subprocess', 'os.system', 'shell=True',
                '$(', '`', '&&', '||', ';', '|',
                '>', '>>', '<', '2>', '&>', 
                'rm -rf', 'dd if=', '/dev/', 'curl', 'wget',
                'chmod +x', 'chmod 777', 'sudo', 'su -'
            ]
            
            cmd_str = ' '.join(args)
            for pattern in dangerous_patterns:
                if pattern in cmd_str:
                    return False, f"Dangerous pattern detected: {pattern}"
            
            # Security: Block interpreter commands with inline code execution flags
            # Prevents creating executable files or running arbitrary code
            if base_cmd in ('python', 'python3', 'node', 'npm'):
                # Block -c flag for python/node (inline code execution)
                if '-c' in args:
                    return False, "Inline code execution (-c flag) is not allowed"
                # Block -e flag for node (eval)
                if base_cmd == 'node' and '-e' in args:
                    return False, "Inline code execution (-e flag) is not allowed"
                # Block npm scripts that could execute arbitrary code
                if base_cmd == 'npm' and 'run' in args:
                    return False, "npm run scripts are not allowed"
            
            return True, args

        def validate_file_changes():
            """
            Security: Validate that only allowed files were modified.
            Returns True if changes are safe, False otherwise.
            """
            try:
                # Get list of modified files in worktree
                result = subprocess.run(
                    ['git', 'diff', '--name-only', 'HEAD'],
                    capture_output=True,
                    text=True,
                    check=True
                )
                
                modified_files = result.stdout.strip().split('\n')
                if not modified_files or modified_files == ['']:
                    modified_files = []
                
                for filepath in modified_files:
                    # Check protected paths
                    for protected in PROTECTED_PATHS:
                        if filepath.startswith(protected):
                            print(f"❌ Security: Attempt to modify protected path: {filepath}")
                            return False
                    
                    # Check file extensions
                    _, ext = os.path.splitext(filepath)
                    if ext and ext not in ALLOWED_EXTENSIONS:
                        print(f"❌ Security: Attempt to modify disallowed file type: {filepath}")
                        return False
                
                # Security: Check for any modifications to .git directory
                # This catches attempts to create hooks or modify git config
                result = subprocess.run(
                    ['find', '.git', '-type', 'f', '-newer', '/tmp/refactor_start_marker'],
                    capture_output=True,
                    text=True,
                    check=False
                )
                
                if result.returncode == 0 and result.stdout.strip():
                    modified_git_files = result.stdout.strip().split('\n')
                    # Filter out expected git files (index, logs, etc.)
                    suspicious_files = [f for f in modified_git_files 
                                       if not any(x in f for x in ['/logs/', '/index', '/COMMIT_EDITMSG', '/FETCH_HEAD', '/HEAD'])]
                    if suspicious_files:
                        print(f"❌ Security: Unauthorized modifications to .git directory detected:")
                        for f in suspicious_files:
                            print(f"   {f}")
                        return False
                
                # Security: Verify Git hooks configuration hasn't been tampered with
                result = subprocess.run(
                    ['git', 'config', '--get', 'core.hooksPath'],
                    capture_output=True,
                    text=True,
                    check=False
                )
                
                hooks_path = result.stdout.strip()
                if hooks_path and hooks_path != '/dev/null':
                    print(f"❌ Security: Git hooks path has been modified to: {hooks_path}")
                    return False
                
                # Security: Check for executable files in .git/hooks/
                result = subprocess.run(
                    ['find', '.git/hooks', '-type', 'f', '-executable'],
                    capture_output=True,
                    text=True,
                    check=False
                )
                
                if result.returncode == 0 and result.stdout.strip():
                    executable_hooks = result.stdout.strip().split('\n')
                    # Filter out sample hooks (non-executable by default)
                    active_hooks = [h for h in executable_hooks if not h.endswith('.sample')]
                    if active_hooks:
                        print(f"❌ Security: Executable Git hooks detected:")
                        for h in active_hooks:
                            print(f"   {h}")
                        return False
                
                return True
                
            except subprocess.CalledProcessError as e:
                print(f"Error checking file changes: {e}")
                return False

        if not os.path.exists(PLAN_FILE):
            print(f"Error: {PLAN_FILE} not found.")
            exit(1)
        
        # Security: Create timestamp marker for detecting .git modifications
        subprocess.run(['touch', '/tmp/refactor_start_marker'], check=True)

        with open(PLAN_FILE, "r") as f:
            lines = f.readlines()

        task_found = False
        updated_lines = []
        current_command = []
        inside_code_block = False
        task_line_index = -1

        # Look for the first uncompleted task "- [ ]"
        for i, line in enumerate(lines):
            if not task_found and line.strip().startswith("- [ ]"):
                task_found = True
                task_line_index = i
                # Mark it as checked right away in memory
                updated_lines.append(line.replace("- [ ]", "- [x]", 1))
                continue
            
            if task_found and not inside_code_block:
                if "```bash" in line:
                    inside_code_block = True
                    continue
                # If we hit another task before a code block, stop looking
                if line.strip().startswith("- [ ]") or line.strip().startswith("- [x]"):
                    break
            
            if inside_code_block:
                if "```" in line:
                    inside_code_block = False
                    break # We have our command
                current_command.append(line.strip())
            
            updated_lines.append(line)

        if not task_found:
            print("🎉 All refactoring tasks are complete! Ending loop.")
            with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
                print("more_tasks=false", file=fh)
            exit(0)

        # Security: Validate and execute each command separately (no shell chaining)
        print(f"Found {len(current_command)} command(s) to execute")
        
        for cmd_line in current_command:
            if not cmd_line:
                continue
                
            print(f"Validating command: {cmd_line}")
            is_valid, result = validate_command(cmd_line)
            
            if not is_valid:
                print(f"❌ Security: Command rejected - {result}")
                print(f"   Command: {cmd_line}")
                exit(1)
            
            parsed_args = result
            print(f"✓ Command validated: {' '.join(parsed_args)}")
            
            try:
                # Security: Execute without shell=True to prevent injection
                subprocess.run(parsed_args, check=True, shell=False)
                print(f"✓ Command executed successfully")
            except subprocess.CalledProcessError as e:
                print(f"❌ Command failed: {e}")
                exit(1)
            except FileNotFoundError as e:
                print(f"❌ Command not found: {e}")
                exit(1)

        # Security: Validate that only allowed files were modified
        print("Validating file changes...")
        if not validate_file_changes():
            print("❌ Security: Unauthorized file modifications detected")
            exit(1)
        
        print("✓ File changes validated")
        
        # If successful, rewrite the markdown file with the completed checkbox
        with open(PLAN_FILE, "w") as f:
            lines[task_line_index] = lines[task_line_index].replace("- [ ]", "- [x]", 1)
            f.writelines(lines)
            
        with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
            print("more_tasks=true", file=fh)
        
        print("✓ Task completed successfully")
        EOF

    - name: Commit Refactored Code and Updated Plan
      if: steps.process_task.outputs.more_tasks == 'true'
      env:
        BRANCH_NAME: ${{ github.ref_name }}
        # Security: Disable Git hooks globally to prevent token exfiltration
        GIT_CONFIG_GLOBAL: /dev/null
        GIT_CONFIG_NOSYSTEM: 1
      run: |
        # Security: Re-authenticate only for the commit step, after package installation
        # This ensures packages cannot access credentials during installation
        # Disable hooks before setting credentials to prevent hook-based token exfiltration
        git config --global core.hooksPath /dev/null
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
        
        # Security: Only stage files that were validated by the Python script
        # Explicitly exclude protected paths to prevent accidental workflow modifications
        git add --all -- ':!.github/workflows/' ':!.git/' ':!secrets/' ':!credentials/'
        
        # Verify no workflow files were staged
        if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
          echo "❌ Security: Attempt to commit workflow files detected"
          exit 1
        fi
        
        # Security: Use --no-verify to bypass any hooks that might have been created
        # This is defense-in-depth; hooks should already be disabled via core.hooksPath
        # Only commit if changes actually occurred
        git diff-index --quiet HEAD || git commit --no-verify -m "🤖 Auto-refactor: completed next task in plan"
        git push --no-verify origin "HEAD:$BRANCH_NAME"

    - name: Trigger Next Refactor Loop Task
      if: steps.process_task.outputs.more_tasks == 'true'
      run: |
        curl -X POST \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://github.com{{ github.repository }}/dispatches \
          -d '{"event_type": "continue-refactor"}'
