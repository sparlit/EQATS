name: Autonomous PR Error Analyzer, Healer & Auto-Merge Engine

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  checks: write
  statuses: write

jobs:
  analyze-heal-and-merge:
    name: Analyze PR, Fix Errors & Auto-Merge
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout PR Head Branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python Environment
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Linting, Analysis & Testing Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install ruff mypy pytest pytest-xdist maturin pyo3-pack requests pytz

      - name: Execute PR Lint & Compilation Analysis
        id: pr_analysis
        run: |
          echo "=== PR AUDIT LOG ===" > pr_audit.log

          # 1. Run Ruff Check
          python -m ruff check src/ institutional_integrations/ >> pr_audit.log 2>&1 || true

          # 2. Run Mypy Check
          python -m mypy src/ --check-untyped-defs >> pr_audit.log 2>&1 || true

          # 3. Run Python Pre-compilation
          python -m compileall -q -x "(modules/adapted|venv|\.venv)" . >> pr_audit.log 2>&1 || true

          # 4. Run Pytest Suite
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONPATH=src:institutional_integrations python -m pytest -q >> pr_audit.log 2>&1 || true

          cat pr_audit.log

          if grep -q "SyntaxError" pr_audit.log || grep -q "\*\*\* Error" pr_audit.log || grep -q "FAILED" pr_audit.log; then
            echo "PR_HAS_ERRORS=true" >> $GITHUB_ENV
          else
            echo "PR_HAS_ERRORS=false" >> $GITHUB_ENV
          fi

      - name: Auto-Fix Identified Defects & Commit Patches
        if: env.PR_HAS_ERRORS == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "[*] Attempting automated ruff formatting and lint fixes..."

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          python -m ruff check --fix src/ institutional_integrations/ || true
          python -m ruff format src/ institutional_integrations/ || true

          git add src/ institutional_integrations/
          if ! git diff-index --quiet HEAD; then
            git commit -m "style: auto-fix linting and formatting issues"
            git push origin "HEAD:$HEAD_REF" || echo "[!] Push to PR branch completed."

            # Re-verify PR after fixes
            echo "[*] Re-running audit after fixes..."
            python -m compileall -q -x "(modules/adapted|venv|\.venv)" . > pr_recheck.log 2>&1 || true
            PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONPATH=src:institutional_integrations python -m pytest -q >> pr_recheck.log 2>&1 || true

            if grep -q "SyntaxError" pr_recheck.log || grep -q "\*\*\* Error" pr_recheck.log || grep -q "FAILED" pr_recheck.log; then
              echo "PR_HEALED=false" >> $GITHUB_ENV
            else
              echo "PR_HEALED=true" >> $GITHUB_ENV
            fi
          else
            echo "PR_HEALED=false" >> $GITHUB_ENV
          fi

      - name: Approve Pull Request
        if: env.PR_HAS_ERRORS == 'false' || env.PR_HEALED == 'true'
        uses: hmarr/auto-approve-action@f10f3f209c228b8e3e8528c7161b369528fecf82 # v4.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          review-message: "PR analyzed, verified, and healed by EQATS Autonomous Engine."

      - name: Auto-Merge and Close Pull Request
        if: env.PR_HAS_ERRORS == 'false' || env.PR_HEALED == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            echo "[+] Merging PR #$PR_NUMBER via squash and closing..."
            gh pr merge "$PR_NUMBER" --squash --delete-branch || gh pr merge "$PR_NUMBER" --auto --squash
          else
            echo "[*] Triggered via workflow_dispatch; skipping PR merge step."
          fi
