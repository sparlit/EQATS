name: Jules Deep Project Refactor

on:
  push:
    branches:
      - 'ai-refactor-/*'    # Triggers when you push to branches like ai-refactor-auth
  workflow_dispatch:        # Allows you to click "Run workflow" manually from GitHub UI

jobs:
  deep-clean:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Grants Jules permission to push the fixed code back

    steps:
      # 1. Checkout the repository using standard FOSS git integrations
      - name: Checkout Repository
        uses: actions/checkout@v5

      # 2. Setup the Python engine
      - name: Setup Python Environment
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Install dependencies and Ruff (100% FOSS Rust-powered linter & formatter)
      - name: Install Dependencies & Ruff Linter
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. Run Ruff to catch syntax flaws, code smells, and TODO/stub patterns
      - name: Run Open-Source Linter Scan
        id: run-linter
        run: |
          echo "🔍 Scanning codebase with Ruff..."
          
          # Run check and output to logs. '|| true' ensures the workflow hands off the logs to Jules instead of crashing.
          ruff check . --statistics > lint_output.log 2>&1 || true
          
          echo "📋 --- RUFF LINTER OUTPUT ---"
          cat lint_output.log
          echo "----------------------------"
          
          # Compress and save the last 40 lines of lint logs for Jules
          CLEAN_LOGS=$(tail -n 40 lint_output.log | tr '\n' ' ')
          echo "lint_logs=$CLEAN_LOGS" >> $GITHUB_OUTPUT

      # 5. Summon Jules with instructions containing the linter report
      - name: Summon Jules for Deep Scan
        uses: google-labs-code/jules-invoke@v1
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          branch: ${{ github.ref_name }}
          prompt: |
            Perform a comprehensive architectural review and code quality deep-dive across the entire repository. 
            
            First, resolve the code style violation issues and logic flaws discovered by our Ruff linter scanner:
            ${{ steps.run-linter.outputs.lint_logs }}

            Second, scan the codebase for the following items, fix them, and replace them with production-ready code:
            1. 🛑 UNFINISHED CODE: Locate all 'TODO', 'FIXME', 'BUG', or 'STUB' comments. Implement the actual intended production logic.
            2. 🧱 PLACEHOLDERS: Find any dummy data, mock responses, placeholder functions, or empty catch blocks, and replace them with real, operational logic.
            3. 📉 CODE FLAWS & BOTTLEENECKS: Identify unoptimized loops, redundant operations, deep nesting, or algorithmic inefficiencies that could cause performance slowdowns.
            4. ⚠️ CODE SMELLS: Clean up unused imports, dead/unreachable code, global variables where isolated variables should be used, and missing type definitions/docstrings.
            
            Operational Constraints:
            - Make sure any real logic you write completely aligns with the existing architecture and patterns used in the repository.
            - Run the project's existing test suite locally in your environment to ensure your optimizations do not break any features.
            - Once all items are rectified and verified, commit and push the completed production-ready code back to this branch.
