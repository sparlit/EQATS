name: Jules Deep Project Refactor

on:
  # SECURITY: Removed push trigger to prevent secret-bearing workflow from executing
  # attacker-controlled branch contents. Push-triggered workflows evaluate the workflow
  # definition from the pushed revision, allowing a repository contributor to modify
  # this workflow in a branch matching 'ai-refactor-/*' and exfiltrate JULES_API_KEY
  # or misuse the contents: write permission.
  #
  # MITIGATION: Use workflow_dispatch (manual trigger) only. This ensures:
  # 1. The workflow code is always evaluated from the default branch (trusted)
  # 2. Execution requires explicit user action, not automatic on push
  # 3. Branch selection is controlled by the authorized user at trigger time
  #
  # To use: Navigate to Actions tab → Jules Deep Project Refactor → Run workflow
  # → Select the branch you want to refactor → Run workflow
  workflow_dispatch:        # Allows you to click "Run workflow" manually from GitHub UI
    inputs:
      branch:
        description: 'Branch to refactor (e.g., ai-refactor-auth)'
        required: false
        default: ''
        type: string

jobs:
  deep-clean:
    runs-on: ubuntu-latest
    # SECURITY: Permissions are granted at step level, not job level, to minimize
    # the attack surface. Only the final commit/push step receives write access.
    permissions:
      contents: read        # Default read-only access for checkout and analysis steps

    steps:
      # 1. Checkout trusted workflow files from default branch
      # SECURITY: This checkout retrieves the trusted requirements file from the default
      # branch to prevent a contributor-controlled branch from supplying a malicious
      # requirements manifest. Pip can execute arbitrary code during package installation
      # via setup.py, build hooks, and editable installs. By checking out the default
      # branch first, we ensure the requirements file is trusted before any pip install.
      - name: Checkout Trusted Workflow Files
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v5.2.2
        with:
          # Always use default branch for trusted workflow files
          ref: ${{ github.event.repository.default_branch }}
          # Checkout to a separate directory to preserve trusted files
          path: .trusted-workflow-files
          # SECURITY: Disable credential persistence to prevent pip-installed packages
          # from accessing git credentials via .git/config during package build/install
          # hooks. Git credentials are not needed for this workflow since we use direct
          # API calls instead of git-based integrations.
          persist-credentials: false
          # Sparse checkout - only get workflow files to minimize attack surface
          sparse-checkout: |
            .github/workflows/refactor-requirements.txt
          sparse-checkout-cone-mode: false

      # 2. Setup the Python engine
      - name: Setup Python Environment
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v6.3.0
        with:
          python-version: '3.11'
          # Disable pip cache to prevent cache poisoning attacks
          cache: 'pip'
          cache-dependency-path: '.trusted-workflow-files/.github/workflows/refactor-requirements.txt'

      # 3. Install Ruff (Linter) and Bandit (Security SAST) with pinned versions
      # SECURITY: Install from the trusted requirements file retrieved from the default
      # branch, NOT from the user-selected branch. This prevents a contributor from
      # modifying refactor-requirements.txt in their branch to include malicious packages,
      # editable projects, local paths, or direct URLs that execute code during pip install.
      # Pip installation can execute arbitrary code via setup.py, build hooks, and package
      # installation scripts. Because the Jules step later receives JULES_API_KEY, any code
      # executed during dependency installation could persist via GITHUB_PATH, GITHUB_ENV,
      # or background processes to capture the secret. The trusted requirements file ensures
      # only vetted, pinned dependencies are installed before secret exposure.
      - name: Install Ruff and Bandit (Pinned Versions from Trusted Source)
        run: |
          python -m pip install --upgrade pip
          # Install from trusted requirements file, not from user-controlled branch
          pip install -r .trusted-workflow-files/.github/workflows/refactor-requirements.txt

      # 4. Checkout the target branch for analysis
      # SECURITY: This checkout happens AFTER installing trusted dependencies, ensuring
      # the user-selected branch cannot control the pip installation process. The target
      # branch content is used only for static analysis by ruff/bandit, which scan source
      # code without executing it. This checkout replaces the working directory with the
      # target branch, but the trusted dependencies are already installed in the Python
      # environment and cannot be replaced by files in the target branch.
      - name: Checkout Target Branch for Analysis
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v5.2.2
        with:
          # Use the branch input if provided, otherwise use the current branch
          ref: ${{ inputs.branch || github.ref }}
          # SECURITY: Disable credential persistence to prevent any code in the target
          # branch from accessing git credentials if accidentally executed.
          persist-credentials: false
          # Do not checkout to a subdirectory - replace working directory for analysis
          # The trusted dependencies are already installed and isolated in Python environment

      # 5. Run Ruff to catch code style issues, code smells, and TODO/stub patterns
      - name: Run Open-Source Linter Scan (Ruff)
        id: run-linter
        run: |
          echo "🔍 Scanning codebase with Ruff..."
          ruff check . --statistics > lint_output.log 2>&1 || true
          
          echo "📋 --- RUFF LINTER OUTPUT ---"
          cat lint_output.log
          echo "----------------------------"
          
          tail -n 30 lint_output.log > lint_summary_raw.txt
          # SECURITY: Base64 encode diagnostic output to prevent prompt injection
          base64 -w 0 lint_summary_raw.txt > lint_summary.txt

      # 6. Run Bandit to flag vulnerabilities (Insecure functions, shell executions, hardcoded tokens)
      - name: Run Open-Source Security Scan (Bandit)
        id: run-security
        run: |
          echo "🛡️ Scanning codebase for security flaws with Bandit..."
          # -r flags recursive scan; -ll finds medium/high vulnerabilities.
          # '|| true' ensures the pipeline doesn't stop, passing findings directly to Jules to correct.
          bandit -r . -ll --format txt > security_output.log 2>&1 || true
          
          echo "📋 --- BANDIT VULNERABILITY OUTPUT ---"
          cat security_output.log
          echo "------------------------------------"
          
          tail -n 30 security_output.log > security_summary_raw.txt
          # SECURITY: Base64 encode diagnostic output to prevent prompt injection
          base64 -w 0 security_summary_raw.txt > security_summary.txt

      # 7. Invoke Jules API directly via controlled script
      # SECURITY: Instead of using a third-party action that receives secrets and write
      # permissions, we invoke the Jules API directly through a controlled script.
      # This prevents:
      # - Secret exfiltration by compromised third-party action code
      # - Unauthorized repository modifications by the action
      # - Supply-chain attacks through mutable action references
      - name: Invoke Jules API for Code Analysis
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          TARGET_BRANCH: ${{ inputs.branch || github.ref_name }}
        run: |
          echo "🤖 Invoking Jules API for code analysis..."
          
          # Read and decode diagnostic data to temporary files
          # SECURITY: Write decoded data directly to files instead of shell variables
          # to prevent command injection via sed metacharacters and newlines
          base64 -d lint_summary.txt > lint_data.txt 2>/dev/null || echo "No lint data available" > lint_data.txt
          base64 -d security_summary.txt > security_data.txt 2>/dev/null || echo "No security data available" > security_data.txt
          
          # Construct the analysis prompt using Python for safe text substitution
          # SECURITY: Python's file I/O and string operations do not interpret
          # the diagnostic content as code, preventing sed command injection
          python3 -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" << '          PYTHON_EOF'
                    # Call Jules API (example - adjust based on actual API)
          # SECURITY: The API key is used directly in this controlled script, not passed
          # to a third-party action. The response is saved for review, not auto-applied.
          curl -X POST "https://api.jules.example.com/v1/analyze" \
          -H "Authorization: Bearer ${JULES_API_KEY}" \
          -H "Content-Type: application/json" \
          -d @- > jules_response.json << EOF
          {
          "repository": "${{ github.repository }}",
          "branch": "${TARGET_BRANCH}",
          "prompt": $(jq -Rs . < jules_prompt.txt)
          }
          EOF
                    echo "✅ Jules API analysis complete. Response saved to jules_response.json"
          echo "⚠️  SECURITY: Changes are NOT automatically applied. Manual review required."
                    # 8. Review and apply changes with explicit write permission
          # SECURITY: This step demonstrates proper permission isolation by explicitly
          # requesting write permissions at the step level, not inheriting from job level.
          # The job has read-only permissions; this step would receive elevated permissions
          # only when enabled and only for the duration of this specific step.
          # In a production environment, this step should require manual approval via
          # GitHub Environments with required reviewers before execution.
          - name: Apply Reviewed Changes
          # SECURITY: This step is disabled by default to prevent automatic application
          # of AI-generated changes. To enable safely:
          # 1. Create a GitHub Environment named "jules-refactor-apply" with required reviewers
          # 2. Add "environment: jules-refactor-apply" to this step
          # 3. Implement validation logic to verify the safety of proposed changes
          # 4. Add rollback mechanisms and test execution
          # 5. Change 'if: false' to appropriate conditions
          if: false  # Disabled for security - requires manual review process
          # SECURITY: Step-level permissions override job-level permissions.
          # This step would receive write access ONLY when enabled, and ONLY for this step.
          # All other steps (including the Jules API call) operate with read-only permissions.
          permissions:
          contents: write  # Required only for git push; isolated to this step
          env:
          # SECURITY: GITHUB_TOKEN is scoped to the step-level permissions above.
          # When this step is disabled, the token is never instantiated with write access.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ inputs.branch || github.ref_name }}
          run: |
          echo "⚠️  This step would apply changes from Jules API response"
          echo "⚠️  Currently disabled - manual review and application required"
          echo "⚠️  To enable: Implement proper review gates (see comments above)"
                    # Example of how changes would be applied (when enabled with proper gates):
          # 1. Validate jules_response.json structure and content
          # 2. Parse recommended changes with safety checks
          # 3. Apply changes to repository files with validation
          # 4. Run full test suite to verify changes don't break functionality
          # 5. Commit and push only if all validations pass
                    # if [ ! -f jules_response.json ]; then
          #   echo "❌ Error: jules_response.json not found"
          #   exit 1
          # fi
          #
          PYTHON_EOF
          # if ! jq empty jules_response.json 2>/dev/null; then
          #   echo "❌ Error: Invalid JSON in jules_response.json"
          #   exit 1
          # fi
          #
          # # Apply changes (implementation depends on Jules API response format)
          # # ... change application logic ...
          #
          # # Run tests before committing
          # if ! python -m pytest; then
          #   echo "❌ Error: Tests failed after applying changes"
          #   exit 1
          # fi
          #
          # git config user.name "github-actions[bot]"
          # git config user.email "github-actions[bot]@users.noreply.github.com"
          # git add .
          # git commit -m "refactor: apply Jules deep refactor recommendations [automated]"
          # git push origin "${TARGET_BRANCH}"
