name: Lint Code Base

on: [push, pull_request]

jobs:
  build:
    name: Lint Code Base
    runs-on: ubuntu-latest
    
    # 1. FIXES THE 403 BADGE CREATION FAILURE
    permissions:
      contents: read
      statuses: write 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint Code Base
        uses: github/super-linter@v5
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 2. FIXES THE 1MB STEP SUMMARY OVERFLOW PANIC
          # Disabling specific engine steps or suppressing verbose log tables stops the 2.9MB overflow
          DISABLE_ERRORS: false 
