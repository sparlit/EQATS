name: AQuICE Continuous Conversion Engine

on:
  workflow_dispatch: # Allows you to manually click "Start Loop" on GitHub

jobs:
  process_all_repositories:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows pushing code to your repository

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install openai gitpython

    - name: Run High-Throughput Engine Loop
      env:
        LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        # Default configuration for hosted NVIDIA NIM API Catalog
        NIM_BASE_URL: "https://nvidia.com"
        NIM_MODEL_NAME: "meta/llama-3.1-405b-instruct"
      run: python .github/scripts/orchestrate_engine.py
