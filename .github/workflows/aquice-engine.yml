name: AQuICE Continuous Conversion Engine

on:
  workflow_dispatch: # Allows you to manually click "Start Loop" on GitHub

jobs:
  process_all_repositories:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows pushing code to your repository

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install openai gitpython

    - name: Set up Rust Toolchain Core
      uses: dtolnay/rust-toolchain@stable

    - name: Run High-Throughput Engine Loop1
      env:
        LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        NIM_BASE_URL: "https://integrate.api.nvidia.com/v1"
        NIM_MODEL_NAME: "moonshotai/kimi-k3"
      run: python .github/scripts/orchestrate_engine.py
      

