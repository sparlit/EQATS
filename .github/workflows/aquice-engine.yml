name: AQuICE Continuous Conversion Engine

on:
  workflow_dispatch: # Allows manual trigger
  repository_dispatch:
    types: [trigger_next_repo]

jobs:
  process_repository:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install openai anthropic gitpython markdown

    - name: Run Orchestration Loop Script
      env:
        LLM_API_KEY: ${{ secrets.LLM_API_KEY }} # Set your OpenAI/Anthropic key in repo secrets
      run: python .github/scripts/orchestrate_engine.py

    - name: Commit and Push Generated Code & Ledgers
      run: |
        git config --local user.email "aquice-bot@github.com"
        git config --local user.name "AQuICE Auto-Architect Bot"
        git add .
        # Only commit if changes exist to avoid empty commit errors
        git diff-index --quiet HEAD || git commit -m "AQuICE: Completed processing phase. Updated ledgers and modules."
        git push origin main

    - name: Trigger Next Repository Loop
      if: success()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Checks if there are still pending items in todo_tasks.md
        if grep -q "⏳" todo_tasks.md || grep -i -q "pending" todo_tasks.md; then
          echo "Pending repositories found. Triggering next iteration..."
          gh api relation /repos/${{ github.repository }}/dispatches \
            -F event_type='trigger_next_repo'
        else
          echo "All targeted repositories successfully adapted. Loop complete!"
        fi
