name: Python 3.13 Free-Threaded Autonomous Healing Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: write
  statuses: write

jobs:
  autonomous-execution-loop:
    name: Multi-Phase Self-Healing Loop Matrix
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: write
      statuses: write

    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Force Synchronize Repository Context
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          echo "Target branch detected for synchronization: $TARGET_BRANCH"

          git fetch origin "$TARGET_BRANCH" || true
          git reset --hard "origin/$TARGET_BRANCH" || true
          git pull origin "$TARGET_BRANCH" --force || true

      - name: Install Free-Threaded Python 3.13 and Native Compiler Toolchains
        run: |
          sudo add-apt-repository ppa:deadsnakes/ppa -y
          sudo apt-get update
          sudo apt-get install -y python3.13-nogil python3.13-dev python3.13-venv rustc cargo patchelf ccache

          PYTHON_CMD=$(which python3.13 2>/dev/null || which python3)
          $PYTHON_CMD -m venv venv
          echo "$GITHUB_WORKSPACE/venv/bin" >> $GITHUB_PATH
          $GITHUB_WORKSPACE/venv/bin/python -m pip install --upgrade pip setuptools wheel

      - name: Install Runtime and Parallel Development Dependencies
        run: |
          "$GITHUB_WORKSPACE/venv/bin/python" -m pip install --upgrade pip
          "$GITHUB_WORKSPACE/venv/bin/pip" install mypy pyflakes ruff pytest pytest-xdist maturin nuitka
          if [ -f requirements.txt ]; then "$GITHUB_WORKSPACE/venv/bin/pip" install -r requirements.txt; fi

      - name: Execute Phase-1 (Mypy Strict Track)
        id: phase_1
        run: |
          echo "=== PHASE-1 MYPY LOG ===" > phase_1_output.log
          "$GITHUB_WORKSPACE/venv/bin/python" -m mypy src --check-untyped-defs --show-traceback >> phase_1_output.log 2>&1 || true
          cat phase_1_output.log

          if grep -q "error:" phase_1_output.log || grep -q "Found" phase_1_output.log; then
            echo "PHASE_1_PASSED=false" >> "$GITHUB_ENV"
            echo "CURRENT_FAILED_PHASE=Phase-1 (Mypy Static Typing Analysis)" >> "$GITHUB_ENV"
          else
            echo "PHASE_1_PASSED=true" >> "$GITHUB_ENV"
          fi

      - name: Execute Phase-2 (Pytest Distributed Track)
        id: phase_2
        run: |
          echo "=== PHASE-2 PYTEST LOG ===" > phase_2_output.log
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONPATH=src "$GITHUB_WORKSPACE/venv/bin/python" -m pytest -n auto -vv -s --cache-clear -k "not gui_integration" --ignore=tests/test_eqats_24_chaos_stress.py >> phase_2_output.log 2>&1 || true
          cat phase_2_output.log

          if grep -q "FAILED" phase_2_output.log || grep -q "ERRORS" phase_2_output.log; then
            echo "PHASE_2_PASSED=false" >> "$GITHUB_ENV"
            echo "CURRENT_FAILED_PHASE=Phase-2 (Pytest Distributed Multi-Thread Matrix)" >> "$GITHUB_ENV"
          else
            echo "PHASE_2_PASSED=true" >> "$GITHUB_ENV"
          fi

      - name: Execute Autonomous Self-Healing Engine
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          "$GITHUB_WORKSPACE/venv/bin/python" .github/scripts/self_healing_engine.py || true
