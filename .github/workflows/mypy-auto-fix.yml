name: Mypy Auto-Fix with Jules

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  mypy-jules-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Adjust to your current project version
          cache: 'pip'

      - name: Install Dependencies & Mypy
        run: |
          python -m pip install --upgrade pip
          pip install mypy
          # If your repository requires local or third-party dependencies to resolve types:
          if [ -f requirementstxt ]; then pip install -r requirements.txt; fi
          # Or if using a setup file: if [ -f setuppy ]; then pip install -e .; fi

      - name: Run Mypy Type Check
        id: mypy-run
        # We append '|| true' to guarantee the workflow doesn't crash on failure,
        # allowing the subsequent Jules step to capture the log output file.
        run: |
          echo "### Mypy Diagnostics Run" > mypy_report.txt
          mypy . --check-untyped-defs --show-error-codes >> mypy_report.txt 2>&1 || true
          cat mypy_report.txt

      - name: Verify Mypy Type Check Report
        run: |
          echo "=== Mypy Type Analysis Report ==="
          cat mypy_report.txt
