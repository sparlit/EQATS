[package]
name = "eqats_rust_core"
version = "10.4.0" # Aligned with your system version matrix
edition = "2021"
authors = ["Simon Peter <author@tsyslabs.com>"]
description = "ELITE QUANTUM AUTONOMOUS TRADING SYSTEM (EQATS) - High-Performance No-GIL Native Extension Core"
publish = false

[lib]
name = "eqats_rust_core"
# cdylib for PyO3 Python C-extension, rlib for internal Rust binary linking
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "blockchain_db"
path = "src/bin/blockchain_db.rs"

[dependencies]
# Upgraded Rayon for optimized cross-core data transformations without GIL locks
rayon = "1.10"

# Upgraded PyO3 to a mature release supporting free-threaded Python out of the box
# The "optional = false" assignment makes the boundary deterministic for your automated CI validation tracking.
pyo3 = { version = "0.22", features = ["extension-module"], optional = false }

[features]
# Cleaned up unnecessary feature loops to allow crisp, automated builds inside the action runner environment
default = ["python"]
python = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
